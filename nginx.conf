worker_processes auto;
events { worker_connections 1024; }
http {
  resolver 1.1.1.1 1.0.0.1 ipv6=off;

  server {
    listen 80;
    server_name files.slidescockpit.com;

    # Optional: statische Indexseite
    location = / {
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # Alle Requests -> Hetzner Bucket (Path-Style)
    location / {
      proxy_set_header Host nbg1.your-objectstorage.com;  # wichtig!
      proxy_ssl_server_name on;
      proxy_redirect off;
      proxy_buffering off;

      # CORS/Cache (optional)
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=3600";

      proxy_pass https://nbg1.your-objectstorage.com/slidescockpit-files$request_uri;
    }
  }
}