events {}

http {
  # DNS für Upstream-Auflösung (wichtig im Container!)
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

  server {
    listen 80 default_server;
    server_name _;

    # einfache Healthcheck-Route
    location = /healthz { return 200 "ok\n"; }

    # Alles 1:1 an Hetzner durchreichen
    location / {
      # CORS-Header für Browser-Zugriff (Canvas, Video-Export, etc.)
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Max-Age "86400" always;

      # Handle preflight OPTIONS requests
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Max-Age "86400";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      proxy_pass https://nbg1.your-objectstorage.com;   # Basis-Endpoint
      # Hetzner wählt den Bucket anhand des Host-Headers (virtual-hosted-style):
      proxy_set_header Host slidescockpit-files.nbg1.your-objectstorage.com;

      # SNI aktivieren + richtigen SNI-Namen setzen
      proxy_ssl_server_name on;
      proxy_ssl_name slidescockpit-files.nbg1.your-objectstorage.com;

      # Standard-Proxy-Header
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_redirect off;
    }
  }
}
